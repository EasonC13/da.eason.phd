<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <style>
    html {
      background-color: #1f1f1f;
      color: #ffffff;
    }

    #app {
      height: 100%;
      width: 100%;
      margin: auto;
    }

    #textarea {
      height: 95vh;
      width: 100%;
      margin: auto;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    #panel {
      position: fixed;
      bottom: 10px;
      right: 10px;
      padding: 10px;
      background-color: rgba(43, 43, 43, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 30vh;
      overflow: auto;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #panel:hover {
      background-color: rgba(43, 43, 43, 1);
      border: 1px solid rgba(255, 255, 255, 1);
    }

    .stored-item {
      margin-bottom: 5px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #panel:hover .stored-item {
      opacity: 1;
    }

    .stored-item button {
      margin-left: 5px;
    }

    .hidden {
      display: none;
    }

    .panel-button {
      width: 100%;
      background-color: rgba(119, 119, 119, 0.05);
      color: rgba(255, 255, 255, 0.05);
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #panel:hover .panel-button {
      background-color: rgba(119, 119, 119, 1);
      color: rgba(255, 255, 255, 1);
    }

    .panel-button:hover {
      background-color: #999999;
    }
  </style>

  <body>
    <div id="app">
      <textarea id="textarea"></textarea>
    </div>

    <div id="panel">
      <button class="panel-button" onclick="toggleStoredTexts()">
        Stored Texts:
      </button>
      <div id="storedTexts" class="hidden"></div>
    </div>

    <script>
      function toggleStoredTexts() {
        var storedTextsDiv = document.getElementById("storedTexts");
        storedTextsDiv.classList.toggle("hidden");
      }

      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOM fully loaded and parsed");
        var textarea = document.getElementById("textarea");
        var storedTextsDiv = document.getElementById("storedTexts");

        // 確保 storedTextsDiv 初始狀態為隱藏
        storedTextsDiv.classList.add("hidden");

        // Retrieve the stored texts array from localStorage, if available
        var storedTexts = localStorage.getItem("storedTexts");
        if (storedTexts) {
          storedTexts = JSON.parse(storedTexts);
        } else {
          storedTexts = [];
        }

        // Update the stored texts panel
        updateStoredTextsPanel();

        // Restore the last stored text, if available
        var lastStoredText =
          storedTexts.length > 0 ? storedTexts[storedTexts.length - 1] : "";
        // textarea.value = lastStoredText;

        textarea.focus();

        // Save the text to the stored texts array when the window is closed
        window.addEventListener("beforeunload", function () {
          saveText();
        });
      });

      // 確保其他函數（如 updateStoredTextsPanel 和 saveText）在這裡定義
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/service-worker.js", { updateViaCache: "none" })
          .then(function (registration) {
            console.log(
              "Service worker registered with scope:",
              registration.scope
            );
            // Check for updates
            registration.update();
          })
          .catch(function (error) {
            console.log("Service worker registration failed:", error);
          });

        // Listen for updates
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          function () {
            console.log("Service Worker updated. Reloading page...");
            window.location.reload();
          }
        );
      }
    </script>
  </body>
</html>
