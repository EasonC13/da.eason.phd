<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        background-color: #1f1f1f;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #app {
        display: flex;
        height: 100vh;
        width: 100%;
        position: relative;
      }

      /* Sidebar styles */
      #sidebar {
        width: 0;
        height: 100%;
        background-color: #2b2b2b;
        border-right: 1px solid #3a3a3a;
        overflow: hidden;
        transition: width 0.3s ease;
        flex-shrink: 0;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
      }

      #sidebar.open {
        width: 300px;
      }

      #sidebar-content {
        width: 300px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      #sidebar-header {
        padding: 15px;
        border-bottom: 1px solid #3a3a3a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #sidebar-header h3 {
        font-size: 14px;
        font-weight: 500;
        color: #aaa;
      }

      #clear-all-btn {
        background: none;
        border: none;
        color: #ff6b6b;
        cursor: pointer;
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 4px;
        transition: background-color 0.2s;
      }

      #clear-all-btn:hover {
        background-color: rgba(255, 107, 107, 0.2);
      }

      #history-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }

      .history-item {
        padding: 12px;
        margin-bottom: 8px;
        background-color: #363636;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
        position: relative;
      }

      .history-item:hover {
        background-color: #444444;
      }

      .history-item-preview {
        font-size: 13px;
        color: #ddd;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 6px;
        padding-right: 20px;
      }

      .history-item-date {
        font-size: 11px;
        color: #888;
      }

      .history-item-delete {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 16px;
        padding: 2px 6px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.2s, color 0.2s;
      }

      .history-item:hover .history-item-delete {
        opacity: 1;
      }

      .history-item-delete:hover {
        color: #ff6b6b;
      }

      .no-history {
        color: #666;
        text-align: center;
        padding: 20px;
        font-size: 13px;
      }

      /* Language selector */
      #sidebar-footer {
        padding: 15px;
        border-top: 1px solid #3a3a3a;
      }

      #language-select {
        width: 100%;
        padding: 8px 12px;
        background-color: #363636;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }

      #language-select:hover {
        border-color: #777;
      }

      #language-select:focus {
        outline: none;
        border-color: #4a9eff;
      }

      /* Main content area */
      #main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      /* Toggle button - transparent, floating */
      #toggle-sidebar {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 101;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.3);
        padding: 8px;
        cursor: pointer;
        font-size: 20px;
        transition: color 0.2s;
        line-height: 1;
      }

      #toggle-sidebar:hover {
        color: rgba(255, 255, 255, 0.8);
      }

      #sidebar.open ~ #main-content #toggle-sidebar {
        left: 310px;
      }

      /* Auto-save indicator */
      #auto-save-indicator {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        transition: color 0.3s, opacity 0.3s;
        pointer-events: none;
      }

      #auto-save-indicator.saving {
        color: rgba(74, 158, 255, 0.8);
      }

      #auto-save-indicator.saved {
        color: rgba(100, 200, 100, 0.6);
      }

      #textarea {
        flex: 1;
        width: 100%;
        height: 100vh;
        padding: 50px 20px 20px 20px;
        background-color: #1f1f1f;
        color: #ffffff;
        border: none;
        resize: none;
        font-size: 16px;
        line-height: 1.6;
        font-family: inherit;
      }

      #textarea:focus {
        outline: none;
      }

      /* Scrollbar styles */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #2b2b2b;
      }

      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #666;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-content">
          <div id="sidebar-header">
            <h3 data-i18n="history">History</h3>
            <button id="clear-all-btn" onclick="clearAllHistory()" data-i18n="clearAll">Clear All</button>
          </div>
          <div id="history-list"></div>
          <div id="sidebar-footer">
            <select id="language-select" onchange="changeLanguage(this.value)">
              <option value="en">English</option>
              <option value="zh-TW">繁體中文</option>
              <option value="zh-CN">简体中文</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
        </div>
      </div>

      <div id="main-content">
        <button id="toggle-sidebar" onclick="toggleSidebar()">☰</button>
        <span id="auto-save-indicator" data-i18n="autoSave">Auto-save</span>
        <textarea id="textarea" data-i18n-placeholder="placeholder"></textarea>
      </div>
    </div>

    <script>
      // Internationalization
      const i18n = {
        'en': {
          history: 'History',
          clearAll: 'Clear All',
          autoSave: 'Auto-save',
          placeholder: 'Start typing...',
          noHistory: 'No history',
          justNow: 'Just now',
          minutesAgo: '{n} min ago',
          hoursAgo: '{n} hr ago',
          daysAgo: '{n} days ago',
          restored: 'Restored',
          deleted: 'Deleted',
          cleared: 'All cleared',
          saving: 'Saving...',
          saved: 'Saved',
          confirmClear: 'Clear all history?',
          empty: '(empty)'
        },
        'zh-TW': {
          history: '歷史記錄',
          clearAll: '清除全部',
          autoSave: '自動保存',
          placeholder: '開始輸入...',
          noHistory: '沒有歷史記錄',
          justNow: '剛剛',
          minutesAgo: '{n} 分鐘前',
          hoursAgo: '{n} 小時前',
          daysAgo: '{n} 天前',
          restored: '已恢復',
          deleted: '已刪除',
          cleared: '已清除全部',
          saving: '保存中...',
          saved: '已保存',
          confirmClear: '確定要清除所有歷史記錄嗎？',
          empty: '(空白)'
        },
        'zh-CN': {
          history: '历史记录',
          clearAll: '清除全部',
          autoSave: '自动保存',
          placeholder: '开始输入...',
          noHistory: '没有历史记录',
          justNow: '刚刚',
          minutesAgo: '{n} 分钟前',
          hoursAgo: '{n} 小时前',
          daysAgo: '{n} 天前',
          restored: '已恢复',
          deleted: '已删除',
          cleared: '已清除全部',
          saving: '保存中...',
          saved: '已保存',
          confirmClear: '确定要清除所有历史记录吗？',
          empty: '(空白)'
        },
        'ja': {
          history: '履歴',
          clearAll: 'すべて削除',
          autoSave: '自動保存',
          placeholder: '入力を開始...',
          noHistory: '履歴がありません',
          justNow: 'たった今',
          minutesAgo: '{n}分前',
          hoursAgo: '{n}時間前',
          daysAgo: '{n}日前',
          restored: '復元しました',
          deleted: '削除しました',
          cleared: 'すべて削除しました',
          saving: '保存中...',
          saved: '保存済み',
          confirmClear: 'すべての履歴を削除しますか？',
          empty: '(空)'
        },
        'ko': {
          history: '기록',
          clearAll: '모두 삭제',
          autoSave: '자동 저장',
          placeholder: '입력 시작...',
          noHistory: '기록 없음',
          justNow: '방금',
          minutesAgo: '{n}분 전',
          hoursAgo: '{n}시간 전',
          daysAgo: '{n}일 전',
          restored: '복원됨',
          deleted: '삭제됨',
          cleared: '모두 삭제됨',
          saving: '저장 중...',
          saved: '저장됨',
          confirmClear: '모든 기록을 삭제하시겠습니까?',
          empty: '(비어 있음)'
        },
        'es': {
          history: 'Historial',
          clearAll: 'Borrar todo',
          autoSave: 'Auto-guardar',
          placeholder: 'Empieza a escribir...',
          noHistory: 'Sin historial',
          justNow: 'Ahora mismo',
          minutesAgo: 'Hace {n} min',
          hoursAgo: 'Hace {n} h',
          daysAgo: 'Hace {n} días',
          restored: 'Restaurado',
          deleted: 'Eliminado',
          cleared: 'Todo borrado',
          saving: 'Guardando...',
          saved: 'Guardado',
          confirmClear: '¿Borrar todo el historial?',
          empty: '(vacío)'
        },
        'fr': {
          history: 'Historique',
          clearAll: 'Tout effacer',
          autoSave: 'Sauvegarde auto',
          placeholder: 'Commencez à écrire...',
          noHistory: 'Aucun historique',
          justNow: 'À l\'instant',
          minutesAgo: 'Il y a {n} min',
          hoursAgo: 'Il y a {n} h',
          daysAgo: 'Il y a {n} jours',
          restored: 'Restauré',
          deleted: 'Supprimé',
          cleared: 'Tout effacé',
          saving: 'Sauvegarde...',
          saved: 'Sauvegardé',
          confirmClear: 'Effacer tout l\'historique ?',
          empty: '(vide)'
        },
        'de': {
          history: 'Verlauf',
          clearAll: 'Alles löschen',
          autoSave: 'Auto-Speichern',
          placeholder: 'Tippen Sie los...',
          noHistory: 'Kein Verlauf',
          justNow: 'Gerade eben',
          minutesAgo: 'Vor {n} Min',
          hoursAgo: 'Vor {n} Std',
          daysAgo: 'Vor {n} Tagen',
          restored: 'Wiederhergestellt',
          deleted: 'Gelöscht',
          cleared: 'Alles gelöscht',
          saving: 'Speichern...',
          saved: 'Gespeichert',
          confirmClear: 'Gesamten Verlauf löschen?',
          empty: '(leer)'
        }
      };

      let currentLang = 'en';

      function t(key, params = {}) {
        let text = i18n[currentLang]?.[key] || i18n['en'][key] || key;
        Object.keys(params).forEach(k => {
          text = text.replace(`{${k}}`, params[k]);
        });
        return text;
      }

      function updateUILanguage() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          el.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          el.placeholder = t(key);
        });
        document.getElementById('language-select').value = currentLang;
        updateHistoryList();
      }

      function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('language', lang);
        updateUILanguage();
      }

      // IndexedDB configuration
      const DB_NAME = 'TextEditorDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'sessions';
      const EXPIRY_DAYS = 3;

      let db = null;
      let autoSaveTimeout = null;
      let lastSavedText = '';

      // Initialize IndexedDB
      function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);

          request.onerror = () => {
            console.error('Failed to open IndexedDB:', request.error);
            reject(request.error);
          };

          request.onsuccess = () => {
            db = request.result;
            console.log('IndexedDB opened successfully');
            resolve(db);
          };

          request.onupgradeneeded = (event) => {
            const database = event.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              const store = database.createObjectStore(STORE_NAME, {
                keyPath: 'id',
                autoIncrement: true
              });
              store.createIndex('timestamp', 'timestamp', { unique: false });
            }
          };
        });
      }

      // Save text to IndexedDB
      function saveText(text) {
        return new Promise((resolve, reject) => {
          if (!db) {
            reject(new Error('Database not initialized'));
            return;
          }

          if (!text || text.trim() === '') {
            resolve(null);
            return;
          }

          const transaction = db.transaction([STORE_NAME], 'readwrite');
          const store = transaction.objectStore(STORE_NAME);

          const session = {
            text: text,
            timestamp: Date.now(),
            expiresAt: Date.now() + (EXPIRY_DAYS * 24 * 60 * 60 * 1000)
          };

          const request = store.add(session);

          request.onsuccess = () => {
            resolve(request.result);
          };

          request.onerror = () => {
            reject(request.error);
          };
        });
      }

      // Get all sessions from IndexedDB
      function getAllSessions() {
        return new Promise((resolve, reject) => {
          if (!db) {
            reject(new Error('Database not initialized'));
            return;
          }

          const transaction = db.transaction([STORE_NAME], 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();

          request.onsuccess = () => {
            const now = Date.now();
            const validSessions = request.result
              .filter(session => session.expiresAt > now)
              .sort((a, b) => b.timestamp - a.timestamp);
            resolve(validSessions);
          };

          request.onerror = () => {
            reject(request.error);
          };
        });
      }

      // Delete a session by ID
      function deleteSession(id) {
        return new Promise((resolve, reject) => {
          if (!db) {
            reject(new Error('Database not initialized'));
            return;
          }

          const transaction = db.transaction([STORE_NAME], 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.delete(id);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      // Clear all sessions
      function clearAllSessions() {
        return new Promise((resolve, reject) => {
          if (!db) {
            reject(new Error('Database not initialized'));
            return;
          }

          const transaction = db.transaction([STORE_NAME], 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.clear();

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      // Clean up expired sessions
      async function cleanupExpiredSessions() {
        if (!db) return;

        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = () => {
          const now = Date.now();
          request.result.forEach(session => {
            if (session.expiresAt <= now) {
              store.delete(session.id);
            }
          });
        };
      }

      // Format timestamp to readable date
      function formatDate(timestamp) {
        const now = Date.now();
        const diffMs = now - timestamp;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMins < 1) return t('justNow');
        if (diffMins < 60) return t('minutesAgo', { n: diffMins });
        if (diffHours < 24) return t('hoursAgo', { n: diffHours });
        return t('daysAgo', { n: diffDays });
      }

      // Get preview text (first line, truncated)
      function getPreview(text) {
        const firstLine = text.split('\n')[0].trim();
        if (firstLine.length > 50) {
          return firstLine.substring(0, 50) + '...';
        }
        return firstLine || t('empty');
      }

      // Update history list UI
      async function updateHistoryList() {
        const historyList = document.getElementById('history-list');

        try {
          const sessions = await getAllSessions();

          if (sessions.length === 0) {
            historyList.innerHTML = `<div class="no-history">${t('noHistory')}</div>`;
            return;
          }

          historyList.innerHTML = sessions.map(session => `
            <div class="history-item" onclick="restoreSession(${session.id})">
              <div class="history-item-preview">${escapeHtml(getPreview(session.text))}</div>
              <div class="history-item-date">${formatDate(session.timestamp)}</div>
              <button class="history-item-delete" onclick="event.stopPropagation(); deleteHistoryItem(${session.id})">×</button>
            </div>
          `).join('');
        } catch (error) {
          console.error('Failed to load history:', error);
          historyList.innerHTML = `<div class="no-history">${t('noHistory')}</div>`;
        }
      }

      // Escape HTML to prevent XSS
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Toggle sidebar
      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('open');
        localStorage.setItem('sidebarOpen', sidebar.classList.contains('open'));
      }

      // Restore session content
      async function restoreSession(id) {
        if (!db) return;

        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(id);

        request.onsuccess = () => {
          if (request.result) {
            document.getElementById('textarea').value = request.result.text;
            lastSavedText = request.result.text;
            showIndicator('restored');
            // Close sidebar after restoring
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('open');
            localStorage.setItem('sidebarOpen', 'false');
          }
        };
      }

      // Delete a history item
      async function deleteHistoryItem(id) {
        try {
          await deleteSession(id);
          await updateHistoryList();
          showIndicator('deleted');
        } catch (error) {
          console.error('Failed to delete item:', error);
        }
      }

      // Clear all history
      async function clearAllHistory() {
        if (confirm(t('confirmClear'))) {
          try {
            await clearAllSessions();
            await updateHistoryList();
            showIndicator('cleared');
          } catch (error) {
            console.error('Failed to clear history:', error);
          }
        }
      }

      // Show auto-save indicator
      function showIndicator(status) {
        const indicator = document.getElementById('auto-save-indicator');
        indicator.className = '';

        switch (status) {
          case 'saving':
            indicator.textContent = t('saving');
            indicator.classList.add('saving');
            break;
          case 'saved':
            indicator.textContent = t('saved');
            indicator.classList.add('saved');
            break;
          case 'restored':
            indicator.textContent = t('restored');
            indicator.classList.add('saved');
            break;
          case 'deleted':
            indicator.textContent = t('deleted');
            break;
          case 'cleared':
            indicator.textContent = t('cleared');
            break;
          default:
            indicator.textContent = t('autoSave');
        }

        if (status !== 'saving') {
          setTimeout(() => {
            indicator.textContent = t('autoSave');
            indicator.className = '';
          }, 2000);
        }
      }

      // Auto-save function
      async function autoSave() {
        const textarea = document.getElementById('textarea');
        const text = textarea.value;

        if (!text || text.trim() === '' || text === lastSavedText) {
          return;
        }

        showIndicator('saving');

        try {
          await saveText(text);
          lastSavedText = text;
          await updateHistoryList();
          showIndicator('saved');
        } catch (error) {
          console.error('Auto-save failed:', error);
        }
      }

      // Debounced auto-save on input
      function scheduleAutoSave() {
        if (autoSaveTimeout) {
          clearTimeout(autoSaveTimeout);
        }
        autoSaveTimeout = setTimeout(autoSave, 2000); // Save 2 seconds after typing stops
      }

      // Initialize app
      async function init() {
        try {
          // Load saved language
          const savedLang = localStorage.getItem('language');
          if (savedLang && i18n[savedLang]) {
            currentLang = savedLang;
          }

          await initDB();
          await cleanupExpiredSessions();

          updateUILanguage();

          // Restore sidebar state
          const sidebarOpen = localStorage.getItem('sidebarOpen') === 'true';
          if (sidebarOpen) {
            document.getElementById('sidebar').classList.add('open');
          }

          const textarea = document.getElementById('textarea');
          textarea.focus();

          // Listen for input to trigger auto-save
          textarea.addEventListener('input', scheduleAutoSave);

          // Save before page unload
          window.addEventListener('beforeunload', () => {
            const text = textarea.value;
            if (text && text.trim() !== '' && text !== lastSavedText) {
              const pendingSave = {
                text: text,
                timestamp: Date.now()
              };
              localStorage.setItem('pendingSave', JSON.stringify(pendingSave));
            }
          });

          // Check for pending save from previous session
          const pendingSave = localStorage.getItem('pendingSave');
          if (pendingSave) {
            try {
              const data = JSON.parse(pendingSave);
              if (Date.now() - data.timestamp < 3600000) {
                await saveText(data.text);
                await updateHistoryList();
              }
              localStorage.removeItem('pendingSave');
            } catch (e) {
              localStorage.removeItem('pendingSave');
            }
          }

        } catch (error) {
          console.error('Failed to initialize:', error);
        }
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/service-worker.js', { updateViaCache: 'none' })
          .then(function (registration) {
            registration.update();
          })
          .catch(function (error) {
            console.log('Service worker registration failed:', error);
          });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
